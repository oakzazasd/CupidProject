<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070910" />
    <meta
      name="description"
      content="Cupid AI — ผู้ช่วยวิเคราะห์ความรักจากอวกาศ สนุก แซะได้ และเปิดเพลงเศร้าให้เมื่อความรักไม่เป็นไปตามแผน"
    />
    <title>Cupid AI — ที่ปรึกษาความรักอวกาศ</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23070910'/%3E%3Cellipse cx='16' cy='16' rx='12' ry='5' fill='none' stroke='%2322D3EE' stroke-width='1.4'/%3E%3Cpath d='M16 24c-4-3-7-5.5-7-9a4 4 0 017-2.6A4 4 0 0123 15c0 3.5-3 6-7 9z' fill='%23F472B6'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        background: #070910;
        color: #f4f5fa;
      }
      #root {
        min-height: 100dvh;
      }
      .boot-splash {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .boot-mark {
        filter: drop-shadow(0 0 18px rgba(139, 92, 246, 0.35));
      }
      .boot-title {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 800;
        letter-spacing: 0.03em;
      }
      .boot-title span {
        color: #f472b6;
      }
      .boot-ring {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        border: 2px solid rgba(139, 92, 246, 0.25);
        border-top-color: #22d3ee;
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-ring {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" class="boot-splash" aria-hidden="true">
        <svg class="boot-mark" width="64" height="64" viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="17" fill="rgba(18,23,42,0.9)" stroke="rgba(148,163,184,0.25)" />
          <ellipse cx="20" cy="20" rx="15" ry="6" fill="none" stroke="#22D3EE" stroke-width="1.2" opacity="0.8" />
          <ellipse
            cx="20"
            cy="20"
            rx="15"
            ry="6"
            fill="none"
            stroke="#8B5CF6"
            stroke-width="1.2"
            opacity="0.6"
            transform="rotate(60 20 20)"
          />
          <path
            d="M20 27.5c-4.6-3.4-7.5-6-7.5-9.5a4.2 4.2 0 017.5-2.6 4.2 4.2 0 017.5 2.6c0 3.5-2.9 6.1-7.5 9.5z"
            fill="#F472B6"
          />
        </svg>
        <p class="boot-title">Cupid <span>AI</span></p>
        <div class="boot-ring"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
